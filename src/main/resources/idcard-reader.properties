# 身份证读卡器配置文件

# 是否使用模拟设备 (true: 模拟设备, false: 真实设备)
idcard.reader.mock=true

# 是否启用签名验证 (仅真实设备有效)
idcard.reader.signature.verification=true

# HTTP连接超时时间(秒)
idcard.reader.connection.timeout=10

# 模拟服务器端口
idcard.reader.mock.port=7846

# 模拟设备信息
idcard.reader.mock.version=SFZ101_V1.1_MOCK
idcard.reader.mock.samid=05.13-20220315-0003607681-1474081524

# 开发模式：自动检测设备并回退到模拟模式
idcard.reader.auto.fallback=true
